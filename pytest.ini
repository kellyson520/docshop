[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-config
    --strict-markers
    --durations=10
markers =
    slow: slow tests
    security: security regression tests
    integration: integration tests
    e2e: end-to-end tests
