services:
  docdist:
    image: ${DOCDIST_IMAGE:-docdist:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        NODE_IMAGE: ${NODE_IMAGE:-node:18.20.8-alpine3.20}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
    ports:
      - "${DOCDIST_PORT:-80}:80"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:???? SECRET_KEY ????}
      DATABASE_URL: sqlite:////app/data/docdist.db
      UPLOAD_DIR: /app/data/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    restart: unless-stopped
    stop_grace_period: 20s
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1200M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docdist-net

networks:
  docdist-net:
    driver: bridge
